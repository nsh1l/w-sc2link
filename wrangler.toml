name = "ayp-trackid"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[ai]
binding = "AI"
remote = true

routes = [
  { pattern = "trackid.alwaysyesterday.party", custom_domain = true }
]

[[ratelimits]]
name = "OCR_RATE_LIMITER"
namespace_id = "1957944122"
simple = { limit = 5, period = 60 }

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
