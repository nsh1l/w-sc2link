<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="DJミックス再生画面のスクショから、いま流れてる曲のリンクを探すツール">
<title>AYP TrackID｜スクショから曲のリンクを探す</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg-deco" aria-hidden="true">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>
</div>

<header class="site-header">
  <div class="brand">
    <div class="vinyl" aria-hidden="true"><span class="vinyl-hole"></span></div>
    <div class="brand-text">
      <h1>AYP<span class="grad"> </span>TrackID</h1>
      <p class="tagline">DJミックスのスクショから、いま流れてる曲のリンクを探す</p>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Step 1: スクショを入れる -->
  <section class="card" aria-label="スクショをアップロード">
    <label class="dropzone" id="dropzone" for="file-input" tabindex="0" role="button" aria-label="スクショ画像を選択">
      <input type="file" id="file-input" accept="image/*" hidden>
      <div class="dz-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
        </svg>
      </div>
      <p class="dz-main">スクショをドロップ or タップで選択</p>
      <p class="dz-sub">PCなら <kbd>Ctrl</kbd>+<kbd>V</kbd> で貼り付けもOK</p>
      <p class="dz-status" id="dz-status" role="status" aria-live="polite"></p>
    </label>
  </section>

  <!-- Step 2: 抽出結果の確認 -->
  <section class="card hidden" id="extract-card" aria-label="曲情報">
    <div class="preview-row">
      <img id="preview" alt="アップロードしたスクショ" class="preview">
      <div class="fields">
        <p class="step-label">📖 スクショから自動抽出（誤字は直接直せるよ）</p>
        <label class="field">
          <span>曲名 / Track</span>
          <input id="f-title" type="text" placeholder="例: Nukennin2.wav (RsCNHO01)" autocomplete="off">
        </label>
        <label class="field">
          <span>アーティスト / Artist</span>
          <input id="f-artist" type="text" placeholder="例: BCHNN _" autocomplete="off">
        </label>
        <div class="chips" id="chips"></div>
        <button class="btn-search" id="btn-search">
          <span class="btn-label">🔍 曲のリンクを探す</span>
          <span class="btn-loading hidden">検索中…</span>
        </button>
      </div>
    </div>
    <details class="raw">
      <summary>OCRで読んだ全文（確認用）</summary>
      <pre id="raw-text"></pre>
    </details>
  </section>

  <!-- Step 3: 結果 -->
  <section class="card hidden" id="results-card" aria-label="検索結果">
    <h2 class="results-title">見つかったリンク <span id="results-count"></span></h2>
    <div id="results" class="results"></div>
    <p class="results-none hidden" id="results-none">見つからなかったにゃ… キーワードを変えてみてね</p>
    <div class="fallback">
      <p class="fallback-label">プラットフォーム内で探す</p>
      <div class="fallback-links" id="fallback-links"></div>
    </div>
  </section>

  <p class="foot-note">曲情報はスクショのOCRで抽出しています。検索は SoundCloud / Deezer / Apple Music をキーなしAPIで横断 🐾</p>
</main>

<!-- SRI は実CDNファイルから算出済み (2026-08-01, tesseract.js@7.0.0) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js" integrity="sha384-2BQ3U3OdKOb0Uczxqr41I9UvZkzr4V9Hv8uSzMMZAlmhsFClvdZX5wi5fDCzG+tM" crossorigin="anonymous"></script>
<script src="/parse.js"></script>
<script src="/app.js"></script>
</body>
</html>
